version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sincrock-crowdsec_server_1
      APP_PORT: 8080
    container_name: sincrock-crowdsec_app_proxy_1

  server:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: sincrock-crowdsec_server_1
    restart: on-failure
    user: "0:0"
    environment:
      - DISABLE_ONLINE_API=false
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/nginx crowdsecurity/base-http-scenarios
    volumes:
      - "${APP_DATA_DIR}/data/config:/etc/crowdsec"
      - "${APP_DATA_DIR}/data/data:/var/lib/crowdsec/data"
      - "${APP_DATA_DIR}/config/acquis.yaml:/etc/crowdsec/acquis.yaml"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "cscli", "vapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s