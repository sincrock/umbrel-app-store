version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: server
      APP_PORT: 8080

  server:
    image: crowdsecurity/crowdsec:latest
    restart: on-failure
    user: "0:0"
    environment:
      - DISABLE_ONLINE_API=false
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/nginx crowdsecurity/base-http-scenarios
    volumes:
      - "${APP_DATA_DIR}/data/config:/etc/crowdsec"
      - "${APP_DATA_DIR}/data/data:/var/lib/crowdsec/data"
      - "/var/log:/var/log:ro"
    healthcheck:
      test: ["CMD", "cscli", "vapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s