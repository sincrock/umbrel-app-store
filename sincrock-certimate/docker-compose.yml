version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sincrock-certimate_server_1
      APP_PORT: 8090
    container_name: sincrock-certimate_app_proxy_1

  server:
    image: certimate/certimate:v0.4
    container_name: sincrock-certimate_server_1
    restart: unless-stopped
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - "${APP_DATA_DIR}/data:/app/pb_data"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s