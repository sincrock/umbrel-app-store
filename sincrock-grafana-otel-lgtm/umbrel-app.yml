name: Grafana OTel LGTM
tagline: "Solução de observabilidade com Grafana, OpenTelemetry Collector, Prometheus, Tempo, Loki, Pyroscope e com OBI (auto-instrumentação via eBPF)"
icon: https://raw.githubusercontent.com/sincrock/umbrel-app-store/main/assets/sincrock-grafana-otel-lgtm/logo.png
