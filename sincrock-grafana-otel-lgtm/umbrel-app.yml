description: >-
  O Grafana OTel LGTM é uma solução de observabilidade completa que integra o Grafana, OpenTelemetry Collector, Prometheus, Tempo, Loki, Pyroscope e OBI (OpenTelemetry eBPF Instrumentation). 

  Ele permite monitorar e analisar métricas, logs e rastreamentos distribuídos de aplicativos e sistemas em tempo real. 

  Com uma interface intuitiva e dashboards personalizáveis, o Grafana OTel LGTM oferece insights valiosos para otimizar o desempenho e a confiabilidade das aplicações.
