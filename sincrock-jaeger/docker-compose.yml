services:
  app_proxy:
    environment:
      APP_HOST: sincrock-jaeger_server_1
      APP_PORT: 16686
      PROXY_AUTH_WHITELIST: "/api/*"
    container_name: sincrock-jaeger_app_proxy_1

  server:
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    container_name: sincrock-jaeger_server_1
    restart: on-failure
    user: "0:0"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "14317:4317"     # OTLP gRPC receiver
      - "14318:4318"     # OTLP HTTP receiver
      - "14250:14250"   # Jaeger collector gRPC (legacy)
      - "14268:14268"   # Jaeger collector HTTP (legacy)
      - "9411:9411"     # Zipkin compatible receiver
      - "6831:6831/udp" # Jaeger agent thrift compact (UDP)
      - "6832:6832/udp" # Jaeger agent thrift binary (UDP)