services:
  app_proxy:
    environment:
      APP_HOST: sincrock-jaeger_server_1
      APP_PORT: 86686
    container_name: sincrock-jaeger_app_proxy_1

  server:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: sincrock-jaeger_server_1
    restart: on-failure
    user: "0:0"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "86686:16686"   # Jaeger Web UI
      - "14250:14250"   # Jaeger collector gRPC
      - "14268:14268"   # Jaeger collector HTTP (thrift)
      - "6831:6831/udp" # Jaeger agent thrift compact (UDP)
      - "6832:6832/udp" # Jaeger agent thrift binary (UDP)