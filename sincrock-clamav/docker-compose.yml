version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sincrock-clamav_web_1
      APP_PORT: 80
    container_name: sincrock-clamav_app_proxy_1

  server:
    image: clamav/clamav-debian:1.5.4@sha256:8117550b0e762eeabe5376c9f6f9c6adbf1a2da50c1bc70c08ae600930817523
    container_name: sincrock-clamav_server_1
    restart: on-failure
    user: "root"
    volumes:
      - "${UMBREL_ROOT}/home/Downloads:/data/downloads:ro"
      - "${UMBREL_ROOT}/home/Documents:/data/documents:ro"
      - "${UMBREL_ROOT}/home/Photos:/data/photos:ro"
      - "${UMBREL_ROOT}/home/Videos:/data/videos:ro"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: python:3.10-alpine
    container_name: sincrock-clamav_web_1
    restart: on-failure
    user: root
    volumes:
      - ${APP_DATA_DIR}/web:/app
      - ${UMBREL_ROOT}/app-data/transmission/data/config:/data/logs:ro
    working_dir: /app
    command: sh -c "pip install flask && python app.py"