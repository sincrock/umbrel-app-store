services:
  app_proxy:
    environment:
      APP_HOST: sincrock-litellm_server_1
      APP_PORT: 4000
      PROXY_AUTH_ADD: “false”
    container_name: sincrock-litellm_app_proxy_1

  server:
    image: docker pull litellm/litellm-database:v1.97.0@sha256:4b3226f4ccd7793d7dca6862d3681604d7ab640d8d6285be6061fd48514e6e71
    container_name: sincrock-litellm_server_1
    restart: unless-stopped
    user: "0:0"
    env_file:
      - ${APP_DATA_DIR}/config/.env
    environment:
      - DATABASE_URL=postgresql://llmadmin:SecretPass123@server-db:5432/litellm_db
    volumes:
      - ${APP_DATA_DIR}/config/litellm_config.yaml:/app/litellm_config.yaml
    depends_on:
      server-db:
        condition: service_healthy

  server-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: sincrock-litellm_server-db_1
    restart: unless-stopped
    environment:
      - POSTGRES_USER=llmadmin
      - POSTGRES_PASSWORD=SecretPass123
      - POSTGRES_DB=litellm_db
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmadmin -d litellm_db"]
      interval: 5s
      timeout: 5s
      retries: 5